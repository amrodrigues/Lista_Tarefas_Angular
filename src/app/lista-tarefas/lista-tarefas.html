<div class="container">
  <h1>Minhas tarefas</h1>

  <div class="form-nova-tarefa">
    <input
      type="text"
      placeholder="Digite uma nova tarefa..."
      [(ngModel)]="novaTarefa"
      (keyup.enter)="adicionarTarefa()" />

    <button (click)="adicionarTarefa()">Adicionar</button>
  </div>

  <ul class="lista">
    <li *ngFor="let tarefa of tarefas; let i = index">
      <input type="checkbox" [(ngModel)]="tarefa.concluida" />

      <span [class.concluida]="tarefa.concluida">
        {{ tarefa.descricao }}
      </span>

      <button class="remover" (click)="removerTarefa(i)">Remover</button>
    </li>
  </ul>

  <p *ngIf="tarefas.length === 0" class="vazio">
    Nenhuma tarefa cadastrada.
  </p>

  <p class="contador">
    Tarefas concluídas: <strong>{{ tarefasConcluidas }}</strong>
  </p>
</div>
